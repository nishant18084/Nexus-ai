<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Free Fire - Battlegrounds 16:9</title>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    user-select: none; 
    -webkit-user-select: none; 
    touch-action: manipulation;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: fixed;
    inset: 0;
  }
  #game-viewport {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }
  canvas#c3d { width: 100%; height: 100%; display: block; }
  
  /* FREE FIRE CROSSHAIR */
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
  }
  .ch-dot { width: 4px; height: 4px; background: rgba(255,255,255,0.9); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .ch-circle { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 0.1s; }
  .ch-red { border-color: #ff2222 !important; box-shadow: 0 0 10px #ff0000; }

  /* TOP HUD */
  #top-bar {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    left: env(safe-area-inset-left, 12px);
    right: env(safe-area-inset-right, 12px);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }
  #minimap-wrap {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    border: 3px solid #ffb300;
    overflow: hidden;
    background: rgba(10, 20, 15, 0.85);
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  #mm-canvas { width: 100%; height: 100%; }
  
  #top-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
  }
  #match-stats {
    display: flex;
    gap: 15px;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    font-weight: bold;
    font-size: 13px;
  }
  #btn-fs-toggle {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.4);
    color: #ffb300;
    font-size: 16px;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* HP / EP HUD */
  #bottom-hud {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 10;
    pointer-events: none;
  }
  #bars { width: 240px; }
  .bar-bg { height: 9px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; margin-bottom: 2px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e52d27, #b31217); transition: width 0.15s; }
  #ep-fill { height: 100%; width: 60%; background: linear-gradient(90deg, #f7971e, #ffd200); }
  .bar-text { position: absolute; top: -1px; left: 6px; font-size: 8px; font-weight: bold; text-shadow: 1px 1px 1px #000; }
  
  #weapon-box {
    position: absolute;
    bottom: 14px;
    right: 14px;
    background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,40,40,0.85));
    border: 2px solid #ffaa00;
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  #gun-name { font-size: 12px; font-weight: 800; color: #ffb300; }
  #ammo-val { font-size: 22px; font-weight: 900; line-height: 1; }

  /* MOBILE TOUCH CONTROLS */
  .touch-btn {
    position: absolute;
    pointer-events: auto;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    z-index: 25;
    touch-action: none;
  }
  .touch-btn:active { background: rgba(255,180,0,0.6); border-color: #ffaa00; }
  #btn-fire { right: 24px; bottom: 70px; width: 68px; height: 68px; font-size: 14px; background: rgba(255,40,40,0.4); border-color: #ff4444; }
  #btn-jump { right: 100px; bottom: 25px; width: 50px; height: 50px; font-size: 12px; }
  #btn-scope { right: 100px; bottom: 85px; width: 50px; height: 50px; font-size: 12px; }
  #btn-reload { right: 34px; bottom: 150px; width: 44px; height: 44px; font-size: 11px; }

  /* CAMERA SWIPE ZONE */
  #look-zone {
    position: absolute;
    top: 0;
    right: 0;
    width: 60%;
    height: 100%;
    z-index: 14;
    touch-action: none;
  }

  /* JOYSTICK */
  #stick-base {
    position: absolute;
    bottom: 25px;
    left: 25px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px dashed rgba(255,255,255,0.3);
    z-index: 25;
    touch-action: none;
  }
  #stick-thumb {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,180,0,0.7);
    top: 30px;
    left: 30px;
    pointer-events: none;
  }

  /* START / FULLSCREEN PROMPT */
  #start-prompt {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    text-align: center;
    padding: 20px;
  }
  #start-btn {
    background: #ff9900;
    color: #000;
    padding: 18px 36px;
    font-weight: 900;
    border-radius: 8px;
    font-size: 19px;
    border: none;
    box-shadow: 0 0 25px rgba(255, 153, 0, 0.7);
    cursor: pointer;
    margin-top: 20px;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-viewport">
  <canvas id="c3d"></canvas>

  <div id="crosshair">
    <div class="ch-circle" id="ch-circle"></div>
    <div class="ch-dot"></div>
  </div>

  <div id="top-bar">
    <div id="minimap-wrap">
      <canvas id="mm-canvas" width="95" height="95"></canvas>
    </div>
    <div id="top-controls">
      <div id="match-stats">
        <div>ALIVE: <span id="alive-count" style="color:#00ff88">12</span></div>
        <div>KILLS: <span id="kill-count" style="color:#ffb300">0</span></div>
      </div>
      <button id="btn-fs-toggle" title="Toggle Fullscreen">⛶</button>
    </div>
  </div>

  <div id="bottom-hud">
    <div id="bars">
      <div class="bar-bg"><div id="ep-fill"></div><div class="bar-text">EP 120/200</div></div>
      <div class="bar-bg"><div id="hp-fill"></div><div class="bar-text" id="hp-txt">HP 200/200</div></div>
    </div>
  </div>

  <div id="weapon-box">
    <div id="gun-name">AK47 - FLAME</div>
    <div id="ammo-val"><span id="clip-val">30</span><span style="font-size:12px;color:#888;">/120</span></div>
  </div>

  <!-- Touch Controls -->
  <div id="look-zone"></div>
  <div id="stick-base"><div id="stick-thumb"></div></div>
  <button class="touch-btn" id="btn-fire">FIRE</button>
  <button class="touch-btn" id="btn-jump">JUMP</button>
  <button class="touch-btn" id="btn-scope">AIM</button>
  <button class="touch-btn" id="btn-reload">LOAD</button>

  <div id="start-prompt">
    <h1 style="color:#ffb300; font-size:28px; letter-spacing:2px; margin-bottom:12px;">FREE FIRE: CLOCK TOWER 3D</h1>
    <p style="color:#ddd; font-size:14px; max-width: 320px; line-height: 1.4;">Game ko bina URL bar ke khelne ke liye Start dabayein</p>
    <button id="start-btn">TAP TO PLAY (FULLSCREEN)</button>
  </div>
</div>

<script>
/* FULLSCREEN & ORIENTATION CONTROLLER */
const viewport = document.getElementById('game-viewport');
const startPrompt = document.getElementById('start-prompt');
const startBtn = document.getElementById('start-btn');
const fsToggleBtn = document.getElementById('btn-fs-toggle');

async function triggerFullscreen() {
  const target = document.documentElement;
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (target.requestFullscreen) {
        await target.requestFullscreen();
      } else if (target.webkitRequestFullscreen) {
        await target.webkitRequestFullscreen();
      }
      
      // Auto Landscape Lock
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape').catch(() => {});
      }
    }
  } catch (err) {
    console.warn("Fullscreen permission error:", err);
  }
}

async function startGame(e) {
  if (e) e.preventDefault();
  await triggerFullscreen();
  startPrompt.style.display = 'none';
  if (audioCtx.state === 'suspended') audioCtx.resume();
  setTimeout(onWindowResize, 150);
}

startBtn.addEventListener('touchend', startGame, { passive: false });
startBtn.addEventListener('click', startGame);

fsToggleBtn.addEventListener('click', async () => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    await triggerFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  setTimeout(onWindowResize, 100);
});

// Fullscreen state listener
document.addEventListener('fullscreenchange', () => {
  onWindowResize();
});

/* AUDIO ENGINE */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playGunshot() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 0.14;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.13);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

/* THREE.JS SCENE SETUP */
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x84c4f9);
scene.fog = new THREE.FogExp2(0x84c4f9, 0.009);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.7);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xfff3d1, 1.2);
dirLight.position.set(60, 100, 40);
dirLight.castShadow = true;
scene.add(dirLight);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(350, 350), new THREE.MeshLambertMaterial({ color: 0x477028 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Central Tower
const clockTower = new THREE.Group();
const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(22, 14, 22), new THREE.MeshLambertMaterial({ color: 0x8a7765 }));
baseMesh.position.y = 7;
baseMesh.castShadow = true;
clockTower.add(baseMesh);

const midMesh = new THREE.Mesh(new THREE.BoxGeometry(14, 30, 14), new THREE.MeshLambertMaterial({ color: 0xa89582 }));
midMesh.position.y = 29;
midMesh.castShadow = true;
clockTower.add(midMesh);

const roofMesh = new THREE.Mesh(new THREE.ConeGeometry(11, 8, 4), new THREE.MeshLambertMaterial({ color: 0xaa2211 }));
roofMesh.position.y = 48;
roofMesh.rotation.y = Math.PI / 4;
roofMesh.castShadow = true;
clockTower.add(roofMesh);
scene.add(clockTower);

// Character Models
function createHumanoidMesh(isEnemy = false) {
  const group = new THREE.Group();
  const skinColor = 0xd99a6c;
  const clothColor = isEnemy ? 0xcc2222 : 0x1b2838;

  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.3, 0.6), new THREE.MeshLambertMaterial({ color: clothColor }));
  torso.position.y = 1.95;
  torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.55), new THREE.MeshLambertMaterial({ color: skinColor }));
  head.position.y = 2.85;
  group.add(head);

  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.35, 1.6), new THREE.MeshLambertMaterial({ color: 0x111111 }));
  gun.position.set(0.45, 1.85, 0.6);
  group.add(gun);

  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.3, 0.42), new THREE.MeshLambertMaterial({ color: 0x222222 }));
  legL.position.set(-0.26, 0.65, 0);
  group.add(legL);

  const legR = legL.clone();
  legR.position.x = 0.26;
  group.add(legR);

  group.legL = legL;
  group.legR = legR;
  group.head = head;
  return group;
}

const player = {
  mesh: createHumanoidMesh(false),
  x: 0, y: 0, z: 45,
  rotY: 0, pitch: 0,
  hp: 200, ammo: 30,
  isReloading: false,
  isScoping: false,
  vy: 0, onGround: true
};
scene.add(player.mesh);

// Enemies
const enemies = [];
for (let i = 0; i < 11; i++) {
  const mesh = createHumanoidMesh(true);
  const angle = (i / 11) * Math.PI * 2;
  const dist = 45 + Math.random() * 50;
  mesh.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
  scene.add(mesh);
  enemies.push({ mesh, hp: 150, alive: true, speed: 0.12, shootTimer: Math.random() * 2 });
}

/* TOUCH SWIPE CAMERA */
const lookZone = document.getElementById('look-zone');
let lastTouchX = null, lastTouchY = null;

lookZone.addEventListener('touchstart', (e) => {
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, { passive: true });

lookZone.addEventListener('touchmove', (e) => {
  if (lastTouchX === null) return;
  const dx = e.touches[0].clientX - lastTouchX;
  const dy = e.touches[0].clientY - lastTouchY;
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;

  player.rotY -= dx * 0.005;
  player.pitch -= dy * 0.004;
  player.pitch = Math.max(-0.6, Math.min(0.6, player.pitch));
}, { passive: true });

lookZone.addEventListener('touchend', () => { lastTouchX = null; lastTouchY = null; });

/* JOYSTICK */
let touchMoveX = 0, touchMoveZ = 0;
const stickBase = document.getElementById('stick-base');
const stickThumb = document.getElementById('stick-thumb');

stickBase.addEventListener('touchstart', handleStick, { passive: false });
stickBase.addEventListener('touchmove', handleStick, { passive: false });
stickBase.addEventListener('touchend', () => {
  touchMoveX = 0; touchMoveZ = 0;
  stickThumb.style.transform = `translate(0px, 0px)`;
});

function handleStick(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = stickBase.getBoundingClientRect();
  let dx = touch.clientX - (rect.left + rect.width / 2);
  let dy = touch.clientY - (rect.top + rect.height / 2);
  const dist = Math.min(36, Math.hypot(dx, dy));
  const angle = Math.atan2(dy, dx);
  const px = Math.cos(angle) * dist;
  const py = Math.sin(angle) * dist;
  stickThumb.style.transform = `translate(${px}px, ${py}px)`;
  touchMoveX = px / 36;
  touchMoveZ = py / 36;
}

document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (player.onGround) { player.vy = 0.36; player.onGround = false; }
});
document.getElementById('btn-scope').addEventListener('touchstart', (e) => {
  e.preventDefault();
  player.isScoping = !player.isScoping;
  camera.fov = player.isScoping ? 30 : 65;
  camera.updateProjectionMatrix();
});
document.getElementById('btn-reload').addEventListener('touchstart', (e) => {
  e.preventDefault();
  player.ammo = 30;
  document.getElementById('clip-val').innerText = '30';
});

/* SHOOTING */
let kills = 0;
function shoot() {
  if (player.ammo <= 0) return;
  player.ammo--;
  document.getElementById('clip-val').innerText = player.ammo;
  playGunshot();

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const targets = enemies.filter(e => e.alive).map(e => e.mesh);
  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length > 0) {
    let hitGroup = hits[0].object.parent;
    while (hitGroup && !hitGroup.head) hitGroup = hitGroup.parent;
    const bot = enemies.find(e => e.mesh === hitGroup && e.alive);
    if (bot) {
      bot.hp -= 40;
      const ch = document.getElementById('ch-circle');
      ch.classList.add('ch-red');
      setTimeout(() => ch.classList.remove('ch-red'), 100);
      if (bot.hp <= 0) {
        bot.alive = false;
        scene.remove(bot.mesh);
        document.getElementById('kill-count').innerText = ++kills;
        document.getElementById('alive-count').innerText = 1 + enemies.filter(e => e.alive).length;
      }
    }
  }
}

/* MINIMAP */
const mmCanvas = document.getElementById('mm-canvas');
const mmCtx = mmCanvas.getContext('2d');
function updateMinimap() {
  mmCtx.clearRect(0, 0, 95, 95);
  mmCtx.save();
  mmCtx.translate(47.5, 47.5);
  mmCtx.rotate(-player.rotY);
  mmCtx.fillStyle = '#2d471e';
  mmCtx.fillRect(-50, -50, 100, 100);

  enemies.forEach(e => {
    if (e.alive) {
      mmCtx.fillStyle = '#ff2222';
      mmCtx.beginPath();
      mmCtx.arc((e.mesh.position.x - player.x) * 0.5, (e.mesh.position.z - player.z) * 0.5, 3, 0, Math.PI * 2);
      mmCtx.fill();
    }
  });
  mmCtx.restore();

  mmCtx.fillStyle = '#ffea00';
  mmCtx.beginPath();
  mmCtx.arc(47.5, 47.5, 4, 0, Math.PI * 2);
  mmCtx.fill();
}

/* MAIN LOOP */
function animate() {
  requestAnimationFrame(animate);

  const speed = 11.0 * 0.016;
  const sin = Math.sin(player.rotY);
  const cos = Math.cos(player.rotY);
  player.x += (touchMoveX * cos + touchMoveZ * sin) * speed;
  player.z += (-touchMoveX * sin + touchMoveZ * cos) * speed;

  player.vy -= 0.018;
  player.y += player.vy;
  if (player.y <= 0) { player.y = 0; player.vy = 0; player.onGround = true; }

  player.mesh.position.set(player.x, player.y, player.z);
  player.mesh.rotation.y = player.rotY;

  const camDist = player.isScoping ? 1.8 : 4.6;
  const targetCamX = player.x - Math.sin(player.rotY) * camDist + Math.cos(player.rotY) * 0.8;
  const targetCamZ = player.z - Math.cos(player.rotY) * camDist - Math.sin(player.rotY) * 0.8;
  const targetCamY = player.y + 2.6 + Math.sin(player.pitch) * camDist;

  camera.position.set(targetCamX, targetCamY, targetCamZ);
  camera.lookAt(player.x + Math.sin(player.rotY) * 30, player.y + 2.6 - Math.sin(player.pitch) * 30, player.z + Math.cos(player.rotY) * 30);

  updateMinimap();
  renderer.render(scene, camera);
}

function onWindowResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}
window.addEventListener('resize', onWindowResize);
window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 200));

animate();
</script>
</body>
</html>
