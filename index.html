<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Free Fire 3D - Battlegrounds</title>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    user-select: none; 
    -webkit-user-select: none; 
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: fixed;
    inset: 0;
  }
  #game-viewport {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas#c3d { width: 100%; height: 100%; display: block; }
  
  /* LOBBY UI OVERLAY */
  #lobby-screen {
    position: absolute;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }
  #lobby-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }
  .player-tag {
    background: rgba(0,0,0,0.7);
    border: 2px solid #ffaa00;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 900;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .player-lvl {
    background: #ffaa00;
    color: #000;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
  }
  #lobby-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: auto;
  }
  .mode-badge {
    background: rgba(0,0,0,0.6);
    border-left: 4px solid #ffaa00;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 0 6px 6px 0;
  }
  #start-match-btn {
    background: linear-gradient(90deg, #ff8800, #ffbb00);
    color: #000;
    padding: 16px 48px;
    font-weight: 900;
    border-radius: 8px;
    font-size: 22px;
    border: none;
    box-shadow: 0 0 25px rgba(255,160,0,0.8);
    cursor: pointer;
    letter-spacing: 2px;
  }
  #start-match-btn:active { transform: scale(0.96); }

  /* IN-GAME HUD (Hidden in Lobby) */
  .ingame-hud { display: none; }

  /* CROSSHAIR */
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
  }
  .ch-dot { width: 4px; height: 4px; background: rgba(255,255,255,0.9); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .ch-circle { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 0.1s; }
  .ch-red { border-color: #ff2222 !important; box-shadow: 0 0 10px #ff0000; }

  /* TOP HUD */
  #top-bar {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }
  #minimap-wrap {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    border: 3px solid #ffb300;
    overflow: hidden;
    background: rgba(10, 20, 15, 0.85);
  }
  #mm-canvas { width: 100%; height: 100%; }
  
  #match-stats {
    display: flex;
    gap: 15px;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    font-weight: bold;
    font-size: 13px;
    align-self: flex-start;
  }

  /* HP HUD */
  #bottom-hud {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 10;
    pointer-events: none;
  }
  #bars { width: 220px; }
  .bar-bg { height: 9px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; margin-bottom: 2px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e52d27, #b31217); }
  #ep-fill { height: 100%; width: 60%; background: linear-gradient(90deg, #f7971e, #ffd200); }
  .bar-text { position: absolute; top: -1px; left: 6px; font-size: 8px; font-weight: bold; }
  
  #weapon-box {
    position: absolute;
    bottom: 14px;
    right: 14px;
    background: rgba(20,20,20,0.85);
    border: 2px solid #ffaa00;
    border-radius: 8px;
    padding: 6px 12px;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  #gun-name { font-size: 11px; font-weight: 800; color: #ffb300; }
  #ammo-val { font-size: 20px; font-weight: 900; }

  /* MOBILE TOUCH CONTROLS */
  .touch-btn {
    position: absolute;
    pointer-events: auto;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    color: #fff;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    z-index: 25;
    touch-action: none;
  }
  .touch-btn:active { background: rgba(255,180,0,0.7); }
  #btn-fire { right: 24px; bottom: 70px; width: 68px; height: 68px; font-size: 14px; background: rgba(255,40,40,0.5); border-color: #ff4444; }
  #btn-jump { right: 100px; bottom: 25px; width: 50px; height: 50px; font-size: 12px; }
  #btn-scope { right: 100px; bottom: 85px; width: 50px; height: 50px; font-size: 12px; }
  #btn-reload { right: 34px; bottom: 150px; width: 44px; height: 44px; font-size: 11px; }

  #look-zone {
    position: absolute;
    top: 0;
    right: 0;
    width: 55%;
    height: 100%;
    z-index: 14;
    touch-action: none;
  }

  #stick-base {
    position: absolute;
    bottom: 25px;
    left: 25px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 2px dashed rgba(255,255,255,0.4);
    z-index: 25;
    touch-action: none;
  }
  #stick-thumb {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,180,0,0.8);
    top: 30px;
    left: 30px;
    pointer-events: none;
  }

  /* BOOYAH SCREEN */
  #booyah-screen {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,180,0,0.3) 0%, rgba(0,0,0,0.85) 80%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  #booyah-text {
    font-size: 72px;
    font-weight: 900;
    font-style: italic;
    color: #ffea00;
    text-shadow: 0 0 20px #ff7700, 0 0 40px #ff3300, 4px 4px 0 #000;
    letter-spacing: 6px;
    animation: booyahPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  #booyah-sub { font-size: 20px; font-weight: bold; margin-top: 15px; }
  #btn-restart {
    margin-top: 30px;
    background: #ffaa00;
    color: #000;
    padding: 14px 34px;
    font-size: 18px;
    font-weight: 900;
    border: none;
    border-radius: 30px;
    box-shadow: 0 0 25px rgba(255,170,0,0.8);
    cursor: pointer;
  }
  @keyframes booyahPop {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-viewport">
  <canvas id="c3d"></canvas>

  <!-- LOBBY SCREEN -->
  <div id="lobby-screen">
    <div id="lobby-top">
      <div class="player-tag">
        <span class="player-lvl">LV. 45</span>
        <span>SHADOW_WARRIOR</span>
      </div>
      <div style="font-size: 14px; font-weight: bold; color: #ffaa00;">BERMUDA CLASSIC</div>
    </div>
    <div id="lobby-bottom">
      <div class="mode-badge">SOLO • CLOCK TOWER</div>
      <button id="start-match-btn">START</button>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="crosshair" class="ingame-hud">
    <div class="ch-circle" id="ch-circle"></div>
    <div class="ch-dot"></div>
  </div>

  <div id="top-bar" class="ingame-hud">
    <div id="minimap-wrap">
      <canvas id="mm-canvas" width="85" height="85"></canvas>
    </div>
    <div id="match-stats">
      <div>ALIVE: <span id="alive-count" style="color:#00ff88">12</span></div>
      <div>KILLS: <span id="kill-count" style="color:#ffb300">0</span></div>
    </div>
  </div>

  <div id="bottom-hud" class="ingame-hud">
    <div id="bars">
      <div class="bar-bg"><div id="ep-fill"></div><div class="bar-text">EP 120/200</div></div>
      <div class="bar-bg"><div id="hp-fill"></div><div class="bar-text">HP 200/200</div></div>
    </div>
  </div>

  <div id="weapon-box" class="ingame-hud">
    <div id="gun-name">ASSASSIN BLADE</div>
    <div id="ammo-val"><span id="clip-val">30</span><span style="font-size:12px;color:#888;">/120</span></div>
  </div>

  <!-- Controls -->
  <div id="look-zone" class="ingame-hud"></div>
  <div id="stick-base" class="ingame-hud"><div id="stick-thumb"></div></div>
  <button class="touch-btn ingame-hud" id="btn-fire">FIRE</button>
  <button class="touch-btn ingame-hud" id="btn-jump">JUMP</button>
  <button class="touch-btn ingame-hud" id="btn-scope">AIM</button>
  <button class="touch-btn ingame-hud" id="btn-reload">LOAD</button>

  <!-- BOOYAH POPUP -->
  <div id="booyah-screen">
    <div id="booyah-text">BOOYAH!</div>
    <div id="booyah-sub">VICTORY #1 / 12</div>
    <button id="btn-restart" onclick="location.reload()">BACK TO LOBBY</button>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  let inLobby = true;
  let gameWon = false;
  let kills = 0;

  const lobbyScreen = document.getElementById('lobby-screen');
  const startMatchBtn = document.getElementById('start-match-btn');
  const ingameHUDs = document.querySelectorAll('.ingame-hud');
  const booyahScreen = document.getElementById('booyah-screen');

  function enterMatch() {
    inLobby = false;
    lobbyScreen.style.display = 'none';

    // Show gameplay UI
    ingameHUDs.forEach(el => {
      if (el.id === 'top-bar' || el.id === 'bottom-hud' || el.id === 'weapon-box') {
        el.style.display = 'flex';
      } else {
        el.style.display = 'block';
      }
    });

    // Fullscreen trigger
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen().catch(() => {});
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } catch(e){}

    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    onWindowResize();
  }

  startMatchBtn.onclick = enterMatch;
  startMatchBtn.ontouchend = (e) => { e.preventDefault(); enterMatch(); };

  /* AUDIO */
  let audioCtx = null;
  function playGunshot() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.2));
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      src.start();
    } catch(e){}
  }

  function playBooyahSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    } catch(e){}
  }

  /* THREE.JS SCENE */
  const canvas = document.getElementById('c3d');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x84c4f9);

  const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.9);
  scene.add(hemiLight);
  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
  dirLight.position.set(40, 80, 40);
  scene.add(dirLight);

  // Ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(350, 350), new THREE.MeshLambertMaterial({ color: 0x477028 }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Tower
  const tower = new THREE.Mesh(new THREE.BoxGeometry(16, 28, 16), new THREE.MeshLambertMaterial({ color: 0x8a7765 }));
  tower.position.set(0, 14, 0);
  scene.add(tower);

  /* ASSASSIN MODEL */
  function createAssassin(isEnemy = false) {
    const group = new THREE.Group();
    const hoodMat = new THREE.MeshLambertMaterial({ color: isEnemy ? 0x4a1818 : 0x2b2735 });
    const redMat = new THREE.MeshLambertMaterial({ color: isEnemy ? 0xff2222 : 0x9e1b26 });
    const darkMat = new THREE.MeshLambertMaterial({ color: 0x1f1d24 });

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 1.1, 8), darkMat);
    body.position.y = 1.9;
    group.add(body);

    const scarf = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.45, 0.3, 8), redMat);
    scarf.position.y = 2.4;
    group.add(scarf);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 12), hoodMat);
    head.position.y = 2.75;
    group.add(head);

    const hoodPeak = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.7, 8), hoodMat);
    hoodPeak.position.set(0, 3.0, -0.05);
    hoodPeak.rotation.x = -0.2;
    group.add(hoodPeak);

    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.15, 1.1), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
    blade.position.set(0.5, 1.7, 0.6);
    group.add(blade);

    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 1.2, 6), darkMat);
    legL.position.set(-0.22, 0.6, 0);
    group.add(legL);

    const legR = legL.clone();
    legR.position.x = 0.22;
    group.add(legR);

    group.head = head;
    return group;
  }

  const player = {
    mesh: createAssassin(false),
    x: 0, y: 0, z: 35,
    rotY: 0, pitch: 0,
    hp: 200, ammo: 30,
    vy: 0, onGround: true
  };
  scene.add(player.mesh);

  const enemies = [];
  for (let i = 0; i < 11; i++) {
    const mesh = createAssassin(true);
    const angle = (i / 11) * Math.PI * 2;
    const dist = 35 + Math.random() * 40;
    mesh.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
    scene.add(mesh);
    enemies.push({ mesh, alive: true });
  }

  /* TOUCH CONTROLS */
  let touchMoveX = 0, touchMoveZ = 0;
  const stickBase = document.getElementById('stick-base');
  const stickThumb = document.getElementById('stick-thumb');

  stickBase.addEventListener('touchstart', handleStick, { passive: false });
  stickBase.addEventListener('touchmove', handleStick, { passive: false });
  stickBase.addEventListener('touchend', () => {
    touchMoveX = 0; touchMoveZ = 0;
    stickThumb.style.transform = `translate(0px, 0px)`;
  });

  function handleStick(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = stickBase.getBoundingClientRect();
    let dx = touch.clientX - (rect.left + rect.width / 2);
    let dy = touch.clientY - (rect.top + rect.height / 2);
    const dist = Math.min(35, Math.hypot(dx, dy));
    const angle = Math.atan2(dy, dx);
    const px = Math.cos(angle) * dist;
    const py = Math.sin(angle) * dist;
    stickThumb.style.transform = `translate(${px}px, ${py}px)`;

    touchMoveX = px / 35;
    touchMoveZ = -py / 35;
  }

  const lookZone = document.getElementById('look-zone');
  let lastX = null, lastY = null;
  lookZone.addEventListener('touchstart', (e) => {
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }, { passive: true });

  lookZone.addEventListener('touchmove', (e) => {
    if (lastX === null) return;
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;

    player.rotY -= dx * 0.005;
    player.pitch -= dy * 0.004;
    player.pitch = Math.max(-0.6, Math.min(0.6, player.pitch));
  }, { passive: true });

  lookZone.addEventListener('touchend', () => { lastX = null; lastY = null; });

  /* ACTIONS & BOOYAH */
  function triggerBooyah() {
    if (gameWon) return;
    gameWon = true;
    playBooyahSound();
    booyahScreen.style.display = 'flex';
  }

  document.getElementById('btn-fire').onclick = () => {
    if (inLobby || player.ammo <= 0 || gameWon) return;
    player.ammo--;
    document.getElementById('clip-val').innerText = player.ammo;
    playGunshot();

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const targets = enemies.filter(e => e.alive).map(e => e.mesh);
    const hits = raycaster.intersectObjects(targets, true);

    if (hits.length > 0) {
      let grp = hits[0].object.parent;
      while (grp && !grp.head) grp = grp.parent;
      const bot = enemies.find(e => e.mesh === grp && e.alive);
      if (bot) {
        bot.alive = false;
        scene.remove(bot.mesh);
        kills++;
        document.getElementById('kill-count').innerText = kills;

        const remainingAlive = 1 + enemies.filter(e => e.alive).length;
        document.getElementById('alive-count').innerText = remainingAlive;

        if (remainingAlive === 1) {
          setTimeout(triggerBooyah, 400);
        }
      }
    }
  };

  document.getElementById('btn-jump').onclick = () => {
    if (player.onGround) { player.vy = 0.35; player.onGround = false; }
  };
  document.getElementById('btn-reload').onclick = () => {
    player.ammo = 30;
    document.getElementById('clip-val').innerText = '30';
  };

  /* MINIMAP */
  const mmCanvas = document.getElementById('mm-canvas');
  const mmCtx = mmCanvas.getContext('2d');
  function updateMinimap() {
    mmCtx.clearRect(0, 0, 85, 85);
    mmCtx.fillStyle = '#2d471e';
    mmCtx.fillRect(0, 0, 85, 85);

    enemies.forEach(e => {
      if (e.alive) {
        mmCtx.fillStyle = '#ff2222';
        mmCtx.beginPath();
        mmCtx.arc(42.5 + (e.mesh.position.x - player.x) * 0.4, 42.5 + (e.mesh.position.z - player.z) * 0.4, 2.5, 0, Math.PI * 2);
        mmCtx.fill();
      }
    });

    mmCtx.fillStyle = '#ffea00';
    mmCtx.beginPath();
    mmCtx.arc(42.5, 42.5, 3.5, 0, Math.PI * 2);
    mmCtx.fill();
  }

  /* LOOP */
  let lobbyTimer = 0;
  function animate() {
    requestAnimationFrame(animate);

    if (inLobby) {
      // Lobby Showcase Mode (Front view with rotating character)
      lobbyTimer += 0.015;
      player.mesh.position.set(0, 0, 0);
      player.mesh.rotation.y = lobbyTimer;
      camera.position.set(0, 2.2, 4.2);
      camera.lookAt(0, 2.0, 0);
    } else {
      // In-Match Gameplay Mode
      const speed = 0.2;
      const sin = Math.sin(player.rotY);
      const cos = Math.cos(player.rotY);

      player.x += (touchMoveX * cos + touchMoveZ * sin) * speed;
      player.z += (-touchMoveX * sin + touchMoveZ * cos) * speed;

      player.vy -= 0.018;
      player.y += player.vy;
      if (player.y <= 0) { player.y = 0; player.vy = 0; player.onGround = true; }

      player.mesh.position.set(player.x, player.y, player.z);
      player.mesh.rotation.y = player.rotY;

      const camDist = 4.5;
      camera.position.set(
        player.x - Math.sin(player.rotY) * camDist + Math.cos(player.rotY) * 0.7,
        player.y + 2.5 + Math.sin(player.pitch) * camDist,
        player.z - Math.cos(player.rotY) * camDist - Math.sin(player.rotY) * 0.7
      );
      camera.lookAt(player.x + Math.sin(player.rotY) * 30, player.y + 2.5 - Math.sin(player.pitch) * 30, player.z + Math.cos(player.rotY) * 30);

      updateMinimap();
    }

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onWindowResize);

  animate();
});
</script>
</body>
</html>
