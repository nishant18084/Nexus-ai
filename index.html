<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Free Fire - Battlegrounds 16:9</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: #050608;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  #game-viewport {
    position: relative;
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    max-height: 100vh;
    max-width: 177.78vh; /* 16:9 */
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255, 180, 0, 0.2);
  }
  canvas#c3d { width: 100%; height: 100%; display: block; }
  
  /* FREE FIRE SIGNATURE HUD */
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
    transition: transform 0.05s ease;
  }
  .ch-dot { width: 4px; height: 4px; background: rgba(255,255,255,0.9); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .ch-circle { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 0.1s; }
  .ch-red { border-color: #ff2222 !important; box-shadow: 0 0 8px #ff0000; }

  /* DAMAGE NUMBERS */
  .dmg-num {
    position: absolute;
    font-weight: 900;
    pointer-events: none;
    animation: floatDmg 0.75s forwards ease-out;
    text-shadow: 2px 2px 0px #000, -1px -1px 0 #000;
    font-size: 24px;
    z-index: 40;
  }
  @keyframes floatDmg {
    0% { opacity: 1; transform: translate(-50%, 0) scale(1.4); }
    100% { opacity: 0; transform: translate(-50%, -55px) scale(0.9); }
  }

  /* TOP BAR & MINIMAP */
  #top-bar {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }
  #minimap-wrap {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid #ffb300;
    overflow: hidden;
    background: rgba(10, 20, 15, 0.85);
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
    position: relative;
  }
  #mm-canvas { width: 100%; height: 100%; }
  
  #match-stats {
    display: flex;
    gap: 15px;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    align-self: flex-start;
    font-weight: bold;
    font-size: 14px;
  }
  .stat-badge { display: flex; align-items: center; gap: 5px; }

  /* HEALTH & WEAPON HUD */
  #bottom-hud {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 10;
    pointer-events: none;
  }
  #bars { width: 280px; }
  .bar-bg { height: 10px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; margin-bottom: 3px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e52d27, #b31217); transition: width 0.15s; }
  #ep-fill { height: 100%; width: 60%; background: linear-gradient(90deg, #f7971e, #ffd200); }
  .bar-text { position: absolute; top: -1px; left: 6px; font-size: 9px; font-weight: bold; text-shadow: 1px 1px 1px #000; }
  
  #weapon-box {
    position: absolute;
    bottom: 15px;
    right: 15px;
    background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,40,40,0.85));
    border: 2px solid #ffaa00;
    border-radius: 8px;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  #gun-name { font-size: 14px; font-weight: 800; color: #ffb300; letter-spacing: 1px; }
  #ammo-val { font-size: 26px; font-weight: 900; line-height: 1; }

  /* MOBILE TOUCH CONTROLS */
  .touch-btn {
    position: absolute;
    pointer-events: auto;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    z-index: 15;
    touch-action: none;
  }
  .touch-btn:active { background: rgba(255,180,0,0.5); border-color: #ffaa00; }
  #btn-fire { right: 28px; bottom: 85px; width: 68px; height: 68px; font-size: 13px; background: rgba(255,50,50,0.3); border-color: #ff4444; }
  #btn-jump { right: 105px; bottom: 35px; width: 50px; height: 50px; font-size: 12px; }
  #btn-scope { right: 105px; bottom: 95px; width: 50px; height: 50px; font-size: 12px; }
  #btn-reload { right: 36px; bottom: 165px; width: 44px; height: 44px; font-size: 11px; }

  #stick-base {
    position: absolute;
    bottom: 30px;
    left: 30px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px dashed rgba(255,255,255,0.3);
    z-index: 15;
    touch-action: none;
  }
  #stick-thumb {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,180,0,0.6);
    top: 33px;
    left: 33px;
    pointer-events: none;
  }

  /* BOOYAH BANNER */
  #booyah-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #booyah-title {
    font-size: 72px;
    font-weight: 900;
    color: #ffcc00;
    text-shadow: 0 0 30px #ff8800, 4px 4px 0 #000;
    letter-spacing: 4px;
    animation: booyahAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes booyahAnim {
    0% { transform: scale(0.2); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  
  #start-prompt {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 90;
    cursor: pointer;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-viewport">
  <canvas id="c3d"></canvas>

  <div id="crosshair">
    <div class="ch-circle" id="ch-circle"></div>
    <div class="ch-dot"></div>
  </div>

  <div id="top-bar">
    <div id="minimap-wrap">
      <canvas id="mm-canvas" width="110" height="110"></canvas>
    </div>
    <div id="match-stats">
      <div class="stat-badge"><span>ALIVE:</span> <span id="alive-count" style="color:#00ff88">12</span></div>
      <div class="stat-badge"><span>KILLS:</span> <span id="kill-count" style="color:#ffb300">0</span></div>
    </div>
  </div>

  <div id="bottom-hud">
    <div id="bars">
      <div class="bar-bg"><div id="ep-fill"></div><div class="bar-text">EP 120/200</div></div>
      <div class="bar-bg"><div id="hp-fill"></div><div class="bar-text" id="hp-txt">HP 200/200</div></div>
    </div>
  </div>

  <div id="weapon-box">
    <div id="gun-name">AK47 - FLAME</div>
    <div id="ammo-val"><span id="clip-val">30</span><span style="font-size:14px;color:#888;">/120</span></div>
  </div>

  <!-- Touch Controls -->
  <div id="stick-base"><div id="stick-thumb"></div></div>
  <button class="touch-btn" id="btn-fire">FIRE</button>
  <button class="touch-btn" id="btn-jump">JUMP</button>
  <button class="touch-btn" id="btn-scope">AIM</button>
  <button class="touch-btn" id="btn-reload">LOAD</button>

  <div id="start-prompt">
    <h1 style="color:#ffb300; font-size:36px; margin-bottom:10px;">FREE FIRE: CLOCK TOWER 3D</h1>
    <p style="color:#ddd; margin-bottom:16px;">PC: WASD to Move | Mouse to Aim | Click to Shoot | Space to Jump</p>
    <div style="background:#ff9900; color:#000; padding:12px 28px; font-weight:900; border-radius:4px; font-size:18px;">TAP TO DROP / PLAY</div>
  </div>

  <div id="booyah-screen">
    <div id="booyah-title">BOOYAH!</div>
    <p style="font-size:20px; color:#fff; margin-top:10px;">MATCH FINISHED - TOP 1</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 24px; background:#ffaa00; border:none; font-weight:bold; cursor:pointer;">PLAY AGAIN</button>
  </div>
</div>

<script>
/* ==================== WEB AUDIO ENGINE ==================== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playGunshot() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const bufferSize = audioCtx.sampleRate * 0.15;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  noise.start();
}

function playHitmarker(headshot = false) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(headshot ? 1200 : 700, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.06);
}

/* ==================== THREE.JS SETUP ==================== */
const viewport = document.getElementById('game-viewport');
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x84c4f9);
scene.fog = new THREE.FogExp2(0x84c4f9, 0.009);

const camera = new THREE.PerspectiveCamera(65, 16 / 9, 0.1, 500);

// Lighting
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.7);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xfff3d1, 1.2);
dirLight.position.set(60, 100, 40);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.left = -90;
dirLight.shadow.camera.right = 90;
dirLight.shadow.camera.top = 90;
dirLight.shadow.camera.bottom = -90;
scene.add(dirLight);

/* ==================== FREE FIRE BERMUDA ARENA ==================== */
// Ground Terrain
const groundGeo = new THREE.PlaneGeometry(350, 350, 32, 32);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x477028 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Central Clock Tower Structure
const clockTower = new THREE.Group();
const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(22, 14, 22), new THREE.MeshLambertMaterial({ color: 0x8a7765 }));
baseMesh.position.y = 7;
baseMesh.castShadow = true;
baseMesh.receiveShadow = true;
clockTower.add(baseMesh);

const midMesh = new THREE.Mesh(new THREE.BoxGeometry(14, 30, 14), new THREE.MeshLambertMaterial({ color: 0xa89582 }));
midMesh.position.y = 29;
midMesh.castShadow = true;
clockTower.add(midMesh);

const roofMesh = new THREE.Mesh(new THREE.ConeGeometry(11, 8, 4), new THREE.MeshLambertMaterial({ color: 0xaa2211 }));
roofMesh.position.y = 48;
roofMesh.rotation.y = Math.PI / 4;
roofMesh.castShadow = true;
clockTower.add(roofMesh);
scene.add(clockTower);

// Crates & Containers
const crateMat = new THREE.MeshLambertMaterial({ color: 0xc27838 });
const containerMat = new THREE.MeshLambertMaterial({ color: 0x1d5f8a });
const obstacles = [];

function addCrate(x, z, s = 2.5) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(s, s, s), crateMat);
  mesh.position.set(x, s / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  obstacles.push({ x, z, radius: s });
}

function addContainer(x, z, rot = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(6, 4.5, 14), containerMat);
  mesh.position.set(x, 2.25, z);
  mesh.rotation.y = rot;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  obstacles.push({ x, z, radius: 6 });
}

// Generate Obstacles & Trees
for (let i = 0; i < 20; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 30 + Math.random() * 80;
  addCrate(Math.cos(angle) * dist, Math.sin(angle) * dist);
}
addContainer(25, -20, 0.4);
addContainer(-30, 30, -0.6);
addContainer(35, 45, 1.2);

/* ==================== HUMANOID CHARACTER BUILDER ==================== */
function createHumanoidMesh(isEnemy = false) {
  const group = new THREE.Group();
  const skinColor = 0xd99a6c;
  const clothColor = isEnemy ? 0xcc2222 : 0x1b2838;
  const pantsColor = isEnemy ? 0x331111 : 0xd19b38;

  // Pelvis / Torso
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.3, 0.6), new THREE.MeshLambertMaterial({ color: clothColor }));
  torso.position.y = 1.95;
  torso.castShadow = true;
  group.add(torso);

  // Vest
  const vest = new THREE.Mesh(new THREE.BoxGeometry(1.08, 0.9, 0.68), new THREE.MeshLambertMaterial({ color: 0x2b2b2b }));
  vest.position.y = 2.0;
  group.add(vest);

  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.55), new THREE.MeshLambertMaterial({ color: skinColor }));
  head.position.y = 2.85;
  head.castShadow = true;
  group.add(head);

  // Gun (AK47 silhouette)
  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.35, 1.6), new THREE.MeshLambertMaterial({ color: 0x111111 }));
  gun.position.set(0.45, 1.85, 0.6);
  group.add(gun);

  // Legs
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.3, 0.42), new THREE.MeshLambertMaterial({ color: pantsColor }));
  legL.position.set(-0.26, 0.65, 0);
  legL.castShadow = true;
  group.add(legL);

  const legR = legL.clone();
  legR.position.x = 0.26;
  group.add(legR);

  group.legL = legL;
  group.legR = legR;
  group.head = head;
  return group;
}

// Player
const player = {
  mesh: createHumanoidMesh(false),
  x: 0, y: 0, z: 45,
  rotY: 0,
  pitch: 0,
  hp: 200,
  ammo: 30,
  isReloading: false,
  isScoping: false,
  vy: 0,
  onGround: true
};
scene.add(player.mesh);

/* ==================== AI ENEMY BOTS ==================== */
const enemies = [];
const enemyCount = 11;
for (let i = 0; i < enemyCount; i++) {
  const mesh = createHumanoidMesh(true);
  const angle = (i / enemyCount) * Math.PI * 2;
  const dist = 45 + Math.random() * 60;
  mesh.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
  scene.add(mesh);

  enemies.push({
    mesh,
    hp: 150,
    alive: true,
    speed: 0.12 + Math.random() * 0.06,
    shootTimer: Math.random() * 2
  });
}

/* ==================== CONTROLS ENGINE ==================== */
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR') reloadGun();
  if (e.code === 'Space' && player.onGround) {
    player.vy = 0.36;
    player.onGround = false;
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

let isPointerLocked = false;
viewport.addEventListener('click', () => {
  document.getElementById('start-prompt').style.display = 'none';
  if (audioCtx.state === 'suspended') audioCtx.resume();
  viewport.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  isPointerLocked = (document.pointerLockElement === viewport);
});

window.addEventListener('mousemove', (e) => {
  if (!isPointerLocked) return;
  player.rotY -= e.movementX * 0.003;
  player.pitch -= e.movementY * 0.0025;
  player.pitch = Math.max(-0.6, Math.min(0.7, player.pitch));
});

window.addEventListener('mousedown', (e) => {
  if (e.button === 0 && isPointerLocked) shoot();
  if (e.button === 2) toggleScope();
});
window.addEventListener('contextmenu', e => e.preventDefault());

/* Virtual Touch Joystick */
let touchMoveX = 0, touchMoveZ = 0;
const stickBase = document.getElementById('stick-base');
const stickThumb = document.getElementById('stick-thumb');

stickBase.addEventListener('touchstart', handleStick, { passive: false });
stickBase.addEventListener('touchmove', handleStick, { passive: false });
stickBase.addEventListener('touchend', () => {
  touchMoveX = 0; touchMoveZ = 0;
  stickThumb.style.transform = `translate(0px, 0px)`;
});

function handleStick(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = stickBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = touch.clientX - cx;
  let dy = touch.clientY - cy;
  const dist = Math.min(40, Math.hypot(dx, dy));
  const angle = Math.atan2(dy, dx);
  const px = Math.cos(angle) * dist;
  const py = Math.sin(angle) * dist;
  stickThumb.style.transform = `translate(${px}px, ${py}px)`;
  touchMoveX = px / 40;
  touchMoveZ = py / 40;
}

document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (player.onGround) { player.vy = 0.36; player.onGround = false; }
});
document.getElementById('btn-scope').addEventListener('touchstart', (e) => { e.preventDefault(); toggleScope(); });
document.getElementById('btn-reload').addEventListener('touchstart', (e) => { e.preventDefault(); reloadGun(); });

/* ==================== SHOOTING & HIT DETECTION ==================== */
function toggleScope() {
  player.isScoping = !player.isScoping;
  camera.fov = player.isScoping ? 30 : 65;
  camera.updateProjectionMatrix();
}

function reloadGun() {
  if (player.isReloading) return;
  player.isReloading = true;
  document.getElementById('clip-val').innerText = '--';
  setTimeout(() => {
    player.ammo = 30;
    player.isReloading = false;
    document.getElementById('clip-val').innerText = '30';
  }, 1200);
}

function showDamageNumber(screenPos, val, isHead) {
  const el = document.createElement('div');
  el.className = 'dmg-num';
  el.innerText = val;
  el.style.color = isHead ? '#ff0033' : '#ffea00';
  el.style.left = `${screenPos.x}px`;
  el.style.top = `${screenPos.y}px`;
  viewport.appendChild(el);
  setTimeout(() => el.remove(), 750);
}

function shoot() {
  if (player.ammo <= 0 || player.isReloading) return reloadGun();
  player.ammo--;
  document.getElementById('clip-val').innerText = player.ammo;
  playGunshot();

  // Screen Muzzle Jitter
  camera.position.y += 0.08;

  // Raycast Center Check
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const targets = enemies.filter(e => e.alive).map(e => e.mesh);
  const hits = raycaster.intersectObjects(targets, true);

  if (hits.length > 0) {
    const hitObj = hits[0].object;
    let hitGroup = hitObj.parent;
    while (hitGroup && !hitGroup.head) hitGroup = hitGroup.parent;

    const bot = enemies.find(e => e.mesh === hitGroup && e.alive);
    if (bot) {
      const isHead = (hitObj === bot.mesh.head);
      const dmg = isHead ? 145 : (32 + Math.floor(Math.random() * 10));
      bot.hp -= dmg;
      playHitmarker(isHead);

      // Flash Crosshair Red
      const ch = document.getElementById('ch-circle');
      ch.classList.add('ch-red');
      setTimeou
