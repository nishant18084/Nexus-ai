<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Free Fire - Battlegrounds 16:9</title>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    user-select: none; 
    -webkit-user-select: none; 
    touch-action: manipulation;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: fixed;
    inset: 0;
  }
  #game-viewport {
    position: absolute;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    overflow: hidden;
  }
  canvas#c3d { width: 100%; height: 100%; display: block; }
  
  /* CROSSHAIR */
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
  }
  .ch-dot { width: 4px; height: 4px; background: rgba(255,255,255,0.9); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .ch-circle { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: all 0.1s; }
  .ch-red { border-color: #ff2222 !important; box-shadow: 0 0 10px #ff0000; }

  /* TOP HUD */
  #top-bar {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    left: env(safe-area-inset-left, 12px);
    right: env(safe-area-inset-right, 12px);
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
  }
  #minimap-wrap {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    border: 3px solid #ffb300;
    overflow: hidden;
    background: rgba(10, 20, 15, 0.85);
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
  }
  #mm-canvas { width: 100%; height: 100%; }
  
  #top-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
  }
  #match-stats {
    display: flex;
    gap: 15px;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    font-weight: bold;
    font-size: 13px;
  }
  #btn-fs-toggle {
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.4);
    color: #ffb300;
    font-size: 16px;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* HP / EP HUD */
  #bottom-hud {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 10;
    pointer-events: none;
  }
  #bars { width: 240px; }
  .bar-bg { height: 9px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; margin-bottom: 2px; position: relative; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e52d27, #b31217); transition: width 0.15s; }
  #ep-fill { height: 100%; width: 60%; background: linear-gradient(90deg, #f7971e, #ffd200); }
  .bar-text { position: absolute; top: -1px; left: 6px; font-size: 8px; font-weight: bold; text-shadow: 1px 1px 1px #000; }
  
  #weapon-box {
    position: absolute;
    bottom: 14px;
    right: 14px;
    background: linear-gradient(135deg, rgba(20,20,20,0.85), rgba(40,40,40,0.85));
    border: 2px solid #ffaa00;
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    pointer-events: none;
    z-index: 10;
  }
  #gun-name { font-size: 12px; font-weight: 800; color: #ffb300; }
  #ammo-val { font-size: 22px; font-weight: 900; line-height: 1; }

  /* MOBILE TOUCH CONTROLS */
  .touch-btn {
    position: absolute;
    pointer-events: auto;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    z-index: 25;
    touch-action: none;
  }
  .touch-btn:active { background: rgba(255,180,0,0.6); border-color: #ffaa00; }
  #btn-fire { right: 24px; bottom: 70px; width: 68px; height: 68px; font-size: 14px; background: rgba(255,40,40,0.4); border-color: #ff4444; }
  #btn-jump { right: 100px; bottom: 25px; width: 50px; height: 50px; font-size: 12px; }
  #btn-scope { right: 100px; bottom: 85px; width: 50px; height: 50px; font-size: 12px; }
  #btn-reload { right: 34px; bottom: 150px; width: 44px; height: 44px; font-size: 11px; }

  /* CAMERA SWIPE ZONE */
  #look-zone {
    position: absolute;
    top: 0;
    right: 0;
    width: 60%;
    height: 100%;
    z-index: 14;
    touch-action: none;
  }

  /* JOYSTICK */
  #stick-base {
    position: absolute;
    bottom: 25px;
    left: 25px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px dashed rgba(255,255,255,0.3);
    z-index: 25;
    touch-action: none;
  }
  #stick-thumb {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,180,0,0.7);
    top: 30px;
    left: 30px;
    pointer-events: none;
  }

  /* START / FULLSCREEN PROMPT */
  #start-prompt {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    text-align: center;
    padding: 20px;
  }
  #start-btn {
    background: #ff9900;
    color: #000;
    padding: 18px 36px;
    font-weight: 900;
    border-radius: 8px;
    font-size: 19px;
    border: none;
    box-shadow: 0 0 25px rgba(255, 153, 0, 0.7);
    cursor: pointer;
    margin-top: 20px;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-viewport">
  <canvas id="c3d"></canvas>

  <div id="crosshair">
    <div class="ch-circle" id="ch-circle"></div>
    <div class="ch-dot"></div>
  </div>

  <div id="top-bar">
    <div id="minimap-wrap">
      <canvas id="mm-canvas" width="95" height="95"></canvas>
    </div>
    <div id="top-controls">
      <div id="match-stats">
        <div>ALIVE: <span id="alive-count" style="color:#00ff88">12</span></div>
        <div>KILLS: <span id="kill-count" style="color:#ffb300">0</span></div>
      </div>
      <button id="btn-fs-toggle" title="Toggle Fullscreen">⛶</button>
    </div>
  </div>

  <div id="bottom-hud">
    <div id="bars">
      <div class="bar-bg"><div id="ep-fill"></div><div class="bar-text">EP 120/200</div></div>
      <div class="bar-bg"><div id="hp-fill"></div><div class="bar-text" id="hp-txt">HP 200/200</div></div>
    </div>
  </div>

  <div id="weapon-box">
    <div id="gun-name">ASSASSIN BLADE & RIFLE</div>
    <div id="ammo-val"><span id="clip-val">30</span><span style="font-size:12px;color:#888;">/120</span></div>
  </div>

  <!-- Touch Controls -->
  <div id="look-zone"></div>
  <div id="stick-base"><div id="stick-thumb"></div></div>
  <button class="touch-btn" id="btn-fire">FIRE</button>
  <button class="touch-btn" id="btn-jump">JUMP</button>
  <button class="touch-btn" id="btn-scope">AIM</button>
  <button class="touch-btn" id="btn-reload">LOAD</button>

  <div id="start-prompt">
    <h1 style="color:#ffb300; font-size:28px; letter-spacing:2px; margin-bottom:12px;">SHADOW ROGUE: 3D ARENA</h1>
    <p style="color:#ddd; font-size:14px; max-width: 320px; line-height: 1.4;">Fullscreen mode mein khelne ke liye start dabayein</p>
    <button id="start-btn">TAP TO PLAY (FULLSCREEN)</button>
  </div>
</div>

<script>
/* FULLSCREEN & ORIENTATION CONTROLLER */
const viewport = document.getElementById('game-viewport');
const startPrompt = document.getElementById('start-prompt');
const startBtn = document.getElementById('start-btn');
const fsToggleBtn = document.getElementById('btn-fs-toggle');

async function triggerFullscreen() {
  const target = document.documentElement;
  try {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (target.requestFullscreen) {
        await target.requestFullscreen();
      } else if (target.webkitRequestFullscreen) {
        await target.webkitRequestFullscreen();
      }
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape').catch(() => {});
      }
    }
  } catch (err) {
    console.warn("Fullscreen permission error:", err);
  }
}

async function startGame(e) {
  if (e) e.preventDefault();
  await triggerFullscreen();
  startPrompt.style.display = 'none';
  if (audioCtx.state === 'suspended') audioCtx.resume();
  setTimeout(onWindowResize, 150);
}

startBtn.addEventListener('touchend', startGame, { passive: false });
startBtn.addEventListener('click', startGame);

fsToggleBtn.addEventListener('click', async () => {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    await triggerFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
  setTimeout(onWindowResize, 100);
});

document.addEventListener('fullscreenchange', () => {
  onWindowResize();
});

/* AUDIO ENGINE */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playGunshot() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const bufferSize = audioCtx.sampleRate * 0.14;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.13);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
}

/* THREE.JS SCENE SETUP */
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x84c4f9);
scene.fog = new THREE.FogExp2(0x84c4f9, 0.009);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445533, 0.85);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.3);
dirLight.position.set(60, 100, 40);
dirLight.castShadow = true;
scene.add(dirLight);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(350, 350), new THREE.MeshLambertMaterial({ color: 0x477028 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Central Tower
const clockTower = new THREE.Group();
const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(22, 14, 22), new THREE.MeshLambertMaterial({ color: 0x8a7765 }));
baseMesh.position.y = 7;
baseMesh.castShadow = true;
clockTower.add(baseMesh);

const midMesh = new THREE.Mesh(new THREE.BoxGeometry(14, 30, 14), new THREE.MeshLambertMaterial({ color: 0xa89582 }));
midMesh.position.y = 29;
midMesh.castShadow = true;
clockTower.add(midMesh);

const roofMesh = new THREE.Mesh(new THREE.ConeGeometry(11, 8, 4), new THREE.MeshLambertMaterial({ color: 0xaa2211 }));
roofMesh.position.y = 48;
roofMesh.rotation.y = Math.PI / 4;
roofMesh.castShadow = true;
clockTower.add(roofMesh);
scene.add(clockTower);

/* ASSASSIN / HOODED CHARACTER MODEL CREATOR */
function createHumanoidMesh(isEnemy = false) {
  const group = new THREE.Group();
  
  // Materials based on image
  const hoodMat = new THREE.MeshLambertMaterial({ color: isEnemy ? 0x3d1a1a : 0x2e293a }); // Dark hooded cowl
  const scarfMat = new THREE.MeshLambertMaterial({ color: isEnemy ? 0xff3333 : 0x9b111e }); // Red scarf / mask
  const tunicMat = new THREE.MeshLambertMaterial({ color: isEnemy ? 0x2b1c1c : 0x3b3333 }); // Leather dark tunic
  const beltMat = new THREE.MeshLambertMaterial({ color: 0x6e4a2a }); // Leather straps / belt
  const goldBuckleMat = new THREE.MeshLambertMaterial({ color: 0xcca03d });
  const leatherPantsMat = new THREE.MeshLambertMaterial({ color: 0x2b2420 });
  const bootMat = new THREE.MeshLambertMaterial({ color: 0x1f1916 });
  const steelMat = new THREE.MeshStandardMaterial({ color: 0xd6d6d6, roughness: 0.2, metalness: 0.85 });

  // 1. Tunic & Torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.54, 1.1, 12), tunicMat);
  torso.position.y = 1.9;
  torso.castShadow = true;
  group.add(torso);

  // Scarf / Cowl wrap around neck
  const cowlWrap = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.54, 0.35, 12), hoodMat);
  cowlWrap.position.y = 2.45;
  group.add(cowlWrap);

  // Red Face Mask / Scarf
  const mask = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.32, 0.36, 12), scarfMat);
  mask.position.set(0, 2.62, 0.08);
  group.add(mask);

  // Inner Shadow / Head
  const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 12), new THREE.MeshBasicMaterial({ color: 0x111111 }));
  headMesh.position.set(0, 2.76, 0.0);
  group.add(headMesh);

  // Big Assassin Hood (Cone + Sphere Peak)
  const hoodCone = new THREE.Mesh(new THREE.ConeGeometry(0.54, 0.85, 14), hoodMat);
  hoodCone.position.set(0, 3.12, -0.06);
  hoodCone.rotation.x = -0.15;
  hoodCone.castShadow = true;
  group.add(hoodCone);

  const hoodCap = new THREE.Mesh(new THREE.SphereGeometry(0.46, 14, 14), hoodMat);
  hoodCap.position.set(0, 2.82, 0);
  group.add(hoodCap);

  // Red Waist Sash / Belt
  const sash = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.54, 0.22, 12), scarfMat);
  sash.position.y = 1.48;
  group.add(sash);

  // Leather Cross Belt
  const crossBelt = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.0, 0.62), beltMat);
  crossBelt.rotation.z = Math.PI / 5;
  crossBelt.position.set(0, 1.95, 0.05);
  group.add(crossBelt);

  // Back Quiver (Arrows)
  const quiver = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 1.1, 8), beltMat);
  quiver.rotation.z = -Math.PI / 4.5;
  quiver.position.set(-0.25, 2.3, -0.42);
  group.add(quiver);

  // Arrow feathers in quiver
  for (let a = 0; a < 3; a++) {
    const arrow = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.35, 0.04), goldBuckleMat);
    arrow.position.set(-0.35 - (a * 0.06), 2.8 + (a * 0.05), -0.42);
    group.add(arrow);
  }

  // Left Leg
  const legLPivot = new THREE.Group();
  legLPivot.position.set(-0.24, 1.35, 0);
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.14, 1.25, 10), leatherPantsMat);
  legL.position.y = -0.62;
  legL.castShadow = true;
  legLPivot.add(legL);
  const bootL = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.25, 0.44), bootMat);
  bootL.position.set(0, -1.2, 0.08);
  legLPivot.add(bootL);
  group.add(legLPivot);

  // Right Leg
  const legRPivot = new THREE.Group();
  legRPivot.position.set(0.24, 1.35, 0);
  const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.14, 1.25, 10), leatherPantsMat);
  legR.position.y = -0.62;
  legR.castShadow = true;
  legRPivot.add(legR);
  const bootR = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.25, 0.44), bootMat);
  bootR.position.set(0, -1.2, 0.08);
  legRPivot.add(bootR);
  group.add(legRPivot);

  // Arms
  const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.9, 8), tunicMat);
  armL.rotation.x = Math.PI / 5;
  armL.position.set(-0.54, 1.85, 0.25);
  group.add(armL);

  const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.9, 8), tunicMat);
  armR.rotation.x = Math.PI / 3;
  armR.rotation.z = -Math.PI / 8;
  armR.position.set(0.54, 1.85, 0.28);
  group.add(armR);

  // Hand Weapon: Assassin Dagger / Curved Blade
  const bladeGroup = new THREE.Group();
  const bladeHilt = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6), beltMat);
  bladeHilt.rotation.x = Math.PI / 2;
  bladeGroup.add(bladeHilt);

  const bladeGuard = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.06, 0.08), goldBuckleMat);
  bladeGuard.position.z = 0.2;
  bladeGroup.add(bladeGuard);

  const bladePoint = new THREE.Mesh(new THREE.ConeGeometry(0.1, 1.2, 4), steelMat);
  bladePoint.rotation.x = Math.PI / 2;
  bladePoint.position.z = 0.8;
  bladeGroup.add(bladePoint);

  bladeGroup.position.set(0.52, 1.7, 0.7);
  group.add(bladeGroup);

  group.legLPivot = legLPivot;
  group.legRPivot = legRPivot;
  group.head = hoodCap;
  return group;
}

const player = {
  mesh: createHumanoidMesh(false),
  x: 0, y: 0, z: 45,
  rotY: 0, pitch: 0,
  hp: 200, ammo: 30,
  isReloading: false,
  isScoping: false,
  vy: 0, onGround: true,
  walkCycle: 0
};
scene.add(player.mesh);

// Enemies
const enemies = [];
for (let i = 0; i < 11; i++) {
  const mesh = createHumanoidMesh(true);
  const angle = (i / 11) * Math.PI * 2;
  const dist = 45 + Math.random() * 50;
  mesh.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
  scene.add(mesh);
  enemies.push({ mesh, hp: 150, alive: true, speed: 0.12, shootTimer: Math.random() * 2 });
}

/* TOUCH SWIPE CAMERA */
const lookZone = document.getElementById('look-zone');
let lastTouchX = null, lastTouchY = null;

lookZone.addEventListener('touchstart', (e) => {
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, { passive: true });

lookZone.addEventListener('touchmove', (e) => {
  if (lastTouchX === null) return;
  const dx = e.touches[0].clientX - lastTouchX;
  const dy = e.touches[0].clientY - lastTouchY;
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;

  player.rotY -= dx * 0.005;
  player.pitch -= dy * 0.004;
  player.pitch = Math.max(-0.6, Math.min(0.6, player.pitch));
}, { passive: true });

lookZone.addEventListener('touchend', () => { lastTouchX = null; lastTouchY = null; });

/* JOYSTICK CONTROLS */
let touchMoveX = 0, touchMoveZ = 0;
const stickBase = document.getElementById('stick-base');
const stickThumb = document.getElementById('stick-thumb');

stickBase.addEventListener('touchstart', handleStick, { passive: false });
stickBase.addEventListener('touchmove', handleStick, { passive: false });
stickBase.addEventListener('touchend', () => {
  touchMoveX = 0; touchMoveZ = 0;
  stickThumb.style.transform = `translate(0px, 0px)`;
});

function handleStick(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = stickBase.getBoundingClientRect();
  let dx = touch.clientX - (rect.left + rect.width / 2);
  let dy = touch.clientY - (rect.top + rect.height / 2);
  const dist = Math.min(36, Math.hypot(dx, dy));
  const angle = Math.atan2(dy, dx);
  const px = Math.cos(angle) * dist;
  const py = Math.sin(angle) * dist;
  stickThumb.style.transform = `translate(${px}px, ${py}px)`;

  touchMoveX = px / 36;
  touchMoveZ = -py / 36; // Forward motion fix
}

document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (player.onGround) { player.vy = 0.36; player.onGround = false; }
});
document.getElementById('btn-scope').addEventListener(
